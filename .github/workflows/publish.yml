name: Publish

# Trusted publishing to PyPI: no API token stored anywhere, the id-token proves
# the release came from this workflow in this repo.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # contents: write is what lets the release be created; the publish itself needs only read.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -q
      - name: Fail if the tag and pyproject disagree
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(uv run python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "$TAG" = "$PKG" ] || { echo "tag $TAG != pyproject $PKG"; exit 1; }
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1

      # After the publish, never before: a release pointing at a version that is not on PyPI is
      # worse than no release at all.
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
