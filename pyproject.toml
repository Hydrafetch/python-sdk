[project]
name = "hydrafetch"
version = "0.4.0"
description = "Official Python client for the Hydrafetch web data API. Turn any URL into clean Markdown and structured data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Hydrafetch", email = "team@hydrafetch.com" }]
keywords = ["hydrafetch", "web-scraping", "markdown", "llm", "rag", "crawler", "structured-data", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.24"]

[project.urls]
Homepage = "https://hydrafetch.com"
Documentation = "https://docs.hydrafetch.com"
Source = "https://github.com/Hydrafetch/python-sdk"
Issues = "https://github.com/Hydrafetch/python-sdk/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hydrafetch"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "pydantic>=2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# PYI019 wants typing.Self on the context managers. Self landed in 3.11 and this
# package supports 3.9, so the bound TypeVars stay until the floor moves.
ignore = ["PYI019"]

[tool.ruff.lint.pyupgrade]
# `from __future__ import annotations` normally makes `X | None` safe on 3.9, which is why ruff
# offers to rewrite Optional. Pydantic evaluates annotations at runtime, so on 3.9 the rewrite
# turns a working model into a TypeError at import. Only the 3.9 CI leg catches it.
keep-runtime-typing = true
